[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hodlodds"
version = "0.3.2"
description = "Python client for HodlOdds: pay-per-answer crash odds for Solana memecoins over x402 (USDC on Solana or Base)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HodlOdds" }]
requires-python = ">=3.10"
dependencies = [
  # 2026.10.19 removes "emSign ECC Root CA - G3" (PyPI/Python CA incident, 2026-10-20); httpx verifies TLS with certifi.
  "certifi>=2026.10.19",
  "httpx>=0.27,<1",
  "x402[svm,evm]==2.25.0",
]
keywords = ["x402", "solana", "base", "usdc", "memecoin", "risk", "pump.fun"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://hodlodds.com"
Source = "https://github.com/hodlodds/hodlodds-sdk"

[project.scripts]
hodlodds = "hodlodds.client:main"
hodlodds-wallet = "hodlodds.wallet:main"

[tool.setuptools]
packages = ["hodlodds"]
