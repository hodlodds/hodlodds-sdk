[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hodlodds-mcp"
version = "0.2.1"
description = "Local stdio MCP tools for HodlOdds crash odds with bounded USDC payments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HodlOdds" }]
dependencies = ["hodlodds>=0.3.2,<0.4", "mcp>=2.3,<3"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://hodlodds.com"
Source = "https://github.com/hodlodds/hodlodds-sdk/tree/main/mcp"
Documentation = "https://api.hodlodds.com/docs"

[project.scripts]
hodlodds-mcp = "hodlodds_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
